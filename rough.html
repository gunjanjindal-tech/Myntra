<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Overflow Fix</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        .card-section {
            display: flex;
            gap: 20px;
            padding: 40px;
            background-color: #f5f5f5;
        }

        .card-images {
            width: 500px;
            height: 438px;
            overflow: hidden;
            position: relative;
            border: 2px solid red;
        }

        .card-images img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease-in-out;
            display: block;
        }

        .card-images:hover img {
            transform: scale(1.2);
        }

        .text {
            text-align: center;
            padding-top: 10px;
            font-size: 24px;
            font-family: sans-serif;
        }
    </style>
</head>

<body>
    <div class="card-section">
        <div>
            <div class="card-images">
                <img src="Images/art-n-decor.webp" alt="Bed Linen">
            </div>
            <div class="text">Bed Linen</div>
        </div>

        <div>
            <div class="card-images">
                <img src="Images/bed.webp" alt="Furnishings">
            </div>
            <div class="text">Furnishings</div>
        </div>
    </div>
</body>

</html>
